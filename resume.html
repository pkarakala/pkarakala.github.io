<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume — Pranav Reddy</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .resume-viewer {
            width: 100%;
            height: 80vh;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 2rem;
        }
        .resume-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .resume-actions .btn {
            font-size: 0.9rem;
        }
        @media (max-width: 768px) {
            .resume-viewer { height: 60vh; }
            .resume-actions { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li class="nav-logo"><a href="index.html">PR</a></li>
            <li><button class="hamburger" id="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button></li>
            <div class="nav-links" id="navLinks">
            <li><a href="about.html">About</a></li>
            <li><a href="index.html#research">Research</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="index.html#skills">Skills</a></li>
            <li><a href="index.html#labs">Labs</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span class="icon-moon">🌙</span>
                    <span class="icon-sun">☀️</span>
                </button>
            </li>
            </div>
        </ul>
    </nav>

    <div class="page-header">
        <h1>Resume</h1>
        <p><a href="https://www.ece.ucsb.edu/" target="_blank" rel="noopener noreferrer" class="hover-link" style="color: inherit;">Electrical &amp; Computer Engineering</a> · <a href="https://www.ucsb.edu/" target="_blank" rel="noopener noreferrer" class="hover-link" style="color: inherit;">UC Santa Barbara</a></p>
    </div>

    <section>
        <div class="resume-actions">
            <a href="assets/pdfs/resume.pdf" class="btn btn-primary" download>Download Resume (PDF)</a>
            <a href="assets/pdfs/resume2.pdf" class="btn btn-outline" download>Download Resume v2 (PDF)</a>
        </div>

        <iframe src="assets/pdfs/resume2.pdf" class="resume-viewer" title="Pranav Reddy Resume"></iframe>
    </section>

    <footer>
        <div class="social-links">
            <a href="https://linkedin.com/in/pranav-reddy" aria-label="LinkedIn">in</a>
            <a href="mailto:preddy@ucsb.edu" aria-label="Email">✉</a>
        </div>
        <p>&copy; 2026 Pranav Reddy. All rights reserved.</p>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => navLinks.classList.toggle('open'));
        navLinks.addEventListener('click', (e) => { if (e.target.tagName === 'A') navLinks.classList.remove('open'); });

        const toggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') root.setAttribute('data-theme', 'dark');
        else if (!saved) root.setAttribute('data-theme', 'dark');
        toggle.addEventListener('click', () => {
            const isDark = root.getAttribute('data-theme') === 'dark';
            if (isDark) { root.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
            else { root.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
        });
    </script>
</body>
</html>
